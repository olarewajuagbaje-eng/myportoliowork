<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agbaje | AI Automation Architect</title>
    <script>
      // SPA fallback for GitHub Pages: preserve deep-link path/query/hash
      // and redirect to the root, where BrowserRouter will render the route.
      (function () {
        var l = window.location;
        var target = l.pathname + l.search + l.hash;
        sessionStorage.setItem("spa-redirect", target);
        l.replace(l.origin + "/");
      })();
    </script>
  </head>
  <body></body>
</html>
